syntax = "proto3";

option go_package = "github.com/24aysh/toll-calc/types";


service Aggregator{
    rpc Aggregate(AggregateRequest) returns (None);
}

message None{
}

message GetInvoiceRequest {
    int32 ObuId = 1; 
}

message AggregateRequest {
    int32 ObuID = 1;
    double Value = 2;
    int64 ProducedAtUnixNano = 3;
    string EventID = 4;
}
